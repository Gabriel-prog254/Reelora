<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>N - Comments</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='8' fill='%23E50914'/><text x='32' y='46' font-family='Arial,Helvetica,sans-serif' font-size='42' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'>C</text></svg>">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar" id="navbar">

        <button class="hamburger" id="hamburger" aria-label="Open menu">&#x2630;</button>

        <a href="../index.html" class="logo">
            <span class="logo-name" data-brand="name"></span>
        </a>

        <nav class="nav-links" id="nav-links">
            <a href="../index.html">Home</a>
            <a href="../index.html#tv-shows">TV Shows</a>
            <a href="../index.html#movies">Movies</a>
            <a href="../index.html#popular">New &amp; Popular</a>
            <a href="music.html">Music</a>
            <a href="favorites.html">My List</a>
        </nav>

        <div class="nav-right">

            <div class="search-box">
                <span><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg></span>
                <input type="text" placeholder="Search">
            </div>

            <a href="notifications.html" class="icon-btn" id="bell" aria-label="Notifications" title="Notifications">&#x1F514;<span class="notif-dot" hidden></span></a>

            <div class="profile">
                <img src="https://i.pravatar.cc/56?img=12" alt="Profile picture">

                <div class="profile-menu">
                    <div class="profile-name"></div>

                    <a href="profiles.html">Manage Profiles</a>
                    <a href="account.html">Account</a>
                    <a href="#">Help Center</a>
                    <a href="profiles.html?signout=1">Sign Out</a>
                </div>
            </div>

        </div>

    </header>


    <!-- COMMENTS -->
    <main class="comments-page">

        <aside class="cm-panel">
            <div class="cm-search">
                <input type="text" id="cm-search" placeholder="Find a title\u2026">
            </div>
            <div class="cm-titles" id="cm-titles"></div>
        </aside>

        <section class="cm-thread-pane">
            <div class="cm-thread-pick" id="cm-thread-pick">
                <p>Pick a movie or show on the left to read and post comments.</p>
            </div>

            <div class="cm-thread" id="cm-thread" hidden>
                <h2 id="cm-thread-title"></h2>
                <p class="cm-thread-sub" id="cm-thread-sub"></p>

                <div class="comment-form">
                    <img id="cm-my-avatar" src="" alt="My avatar">
                    <textarea id="cm-new" rows="3" maxlength="500" placeholder="Share your thoughts\u2026"></textarea>
                    <button class="btn-comment" id="cm-post" type="button">Post</button>
                </div>

                <div id="cm-comments"></div>
            </div>
        </section>

    </main>


    <!-- TOAST -->
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>


    <script src="../assets/js/config.local.js"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/branding.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/movies.js"></script>
    <script src="../assets/js/profile.js"></script>
    <script src="../assets/js/comments.js"></script>
</body>
</html>
