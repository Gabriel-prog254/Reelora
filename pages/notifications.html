<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        try {
            if (localStorage.getItem("cinemoraSignedIn") !== "1") {
                location.replace("Login.html");
            }
        } catch (e) {
            location.replace("Login.html");
        }
    </script>

    <title>Reelora - Notifications</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='8' fill='%23D33A2B'/><text x='32' y='46' font-family='Arial,Helvetica,sans-serif' font-size='42' font-weight='bold' fill='%23FFFFFF' text-anchor='middle'>R</text></svg>">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar" id="navbar">

        <button class="hamburger" id="hamburger" aria-label="Open menu">&#x2630;</button>

        <a href="../index.html" class="logo">
            <span class="logo-name" data-brand="name"></span>
        </a>

        <nav class="nav-links" id="nav-links">
            <a href="../index.html">Home</a>
            <a href="../index.html#tv-shows">TV Shows</a>
            <a href="../index.html#movies">Movies</a>
            <a href="../index.html#popular">New &amp; Popular</a>
            <a href="music.html">Music</a>
            <a href="favorites.html">My List</a>
        </nav>

        <div class="nav-right">

            <div class="search-box">
                <span><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg></span>
                <input type="text" placeholder="Search">
            </div>

            <a href="notifications.html" class="icon-btn" id="bell" aria-label="Notifications" title="Notifications">&#x1F514;<span class="notif-dot" hidden></span></a>

            <div class="profile">
                <img src="https://i.pravatar.cc/56?img=12" alt="Profile picture">

                <div class="profile-menu">
                    <div class="profile-name"></div>

                    <a href="profiles.html">Manage Profiles</a>
                    <a href="account.html">Account</a>
                    <a href="#">Help Center</a>
                    <a href="profiles.html?signout=1">Sign Out</a>
                </div>
            </div>

        </div>

    </header>


    <!-- NOTIFICATIONS -->
    <main class="notif-page">

        <div class="notif-head">
            <h1>Notifications</h1>
            <div>
                <button class="btn-ghost" id="mark-all">Mark all as read</button>
                <button class="btn-ghost" id="clear-all">Clear all</button>
            </div>
        </div>

        <div class="notif-list" id="notif-list"></div>

        <div class="notif-empty" id="notif-empty" hidden>
            <p>You're all caught up!</p>
        </div>

    </main>


    <!-- TOAST -->
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>


    <script src="../assets/js/config.local.js"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/branding.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/profile.js"></script>
    <script src="../assets/js/notifications.js"></script>
</body>
</html>
